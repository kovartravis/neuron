name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      pkg_name: ${{ steps.version.outputs.pkg_name }}
      tag: ${{ steps.version.outputs.tag }}
      already_published: ${{ steps.check.outputs.already_published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Architecture drift check
        run: |
          set +e
          node dist/cli.js scan --check --no-progress
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::error::.neuron/architecture.md is stale -- src/ changed exports/structure since the last scan. Run 'neuron scan' locally and commit the refreshed card."
            exit 1
          elif [ "$code" -eq 2 ]; then
            echo "::error::.neuron/architecture.md's baseline isn't comparable (likely a neuron version upgrade changed parser fidelity, not a code change). Run 'neuron scan' locally to re-baseline and commit the result."
            exit 1
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Resolve version and dist-tag
        id: version
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PKG_NAME="$(node -p "require('./package.json').name")"

          if [[ "$PKG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            DIST_TAG="latest"
          elif [[ "$PKG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            DIST_TAG="rc"
          else
            echo "::error::Unrecognized version format '$PKG_VERSION' -- only a bare MAJOR.MINOR.PATCH (-> latest dist-tag) or MAJOR.MINOR.PATCH-rcN (-> rc dist-tag) is supported. Refusing to guess a dist-tag for anything else (e.g. -beta, -alpha)."
            exit 1
          fi

          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "pkg_name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published
        id: check
        run: |
          set -euo pipefail
          PKG_REF="${{ steps.version.outputs.pkg_name }}@${{ steps.version.outputs.version }}"
          if npm view "$PKG_REF" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "## Skipped: $PKG_REF is already on npm" >> "$GITHUB_STEP_SUMMARY"
            echo "package.json's version wasn't bumped by this push, so there is nothing new to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: build-and-test
    if: needs.build-and-test.outputs.already_published == 'false'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@latest

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --tag ${{ needs.build-and-test.outputs.dist_tag }}

      - name: Tag release commit
        run: |
          set -euo pipefail
          TAG="${{ needs.build-and-test.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::warning::Git tag $TAG already exists -- npm publish succeeded but the tag was left as-is."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Summary
        run: |
          echo "## Published ${{ needs.build-and-test.outputs.pkg_name }}@${{ needs.build-and-test.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "dist-tag: \`${{ needs.build-and-test.outputs.dist_tag }}\`, git tag: \`${{ needs.build-and-test.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
