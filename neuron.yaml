version: "1.0"

storage:
  mode: vector-only
  path: .neuron

categories:
  learning:
    description: Agent conventions, rules, and failure fixes
    tags:
      - rule
      - convention
      - failure-fix

  history:
    description: Action history log and completed task summary
    tags:
      - task
      - history

  decisions:
    description: Architectural Decision Records (ADRs) & design choices
    tags:
      - adr
      - architecture
      - design

scan:
  enabled: true
  category: decisions
  depth: 3


pullRules:
  default:
    categories:
      - learning
      - decisions
    limit: 5
    minScore: 0.35

  onExec:
    - commandPattern: ".*"
      categories:
        - learning
      limit: 5

    - commandPattern: "^(npm test|git commit)"
      categories:
        - learning
        - history
        - decisions
      limit: 8
