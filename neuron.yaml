version: "1.0"

storage:
  mode: md
  path: .neuron

categories:
  learning:
    description: Agent conventions, rules, and failure fixes
    tags:
      - rule
      - convention
      - failure-fix

  decisions:
    description: Architectural Decision Records (ADRs) & design choices
    tags:
      - adr
      - architecture
      - design
  architecture: {}

  # Ticket 9 (neuron-2.4.3): split from a single `tickets` category into
  # three by temporal status, executing the design Ticket 3 settled via
  # /grilling. Same declared fields on all three (a child ticket's `map`
  # value must resolve regardless of which of the three it or its parent
  # lives in). Archive trigger is whole-map-on-close, not per-ticket —
  # see docs/agents/issue-tracker.md's "Wayfinding operations" section.
  tickets-present:
    description: >-
      Wayfinder maps actively being worked (sequenced), and their open and
      resolved children — issue tracker (ADR 0018), present tier
      (Ticket 9, neuron-2.4.3).
    storage: md
    fields: &ticketsFields
      status:
        type: enum
        values: [unclaimed, claimed, resolved]
        default: unclaimed
      # ADR 0018 names this field "type"; renamed to "kind" here because
      # "type" is already a reserved built-in CLI flag (--type,
      # neuronYaml.ts's RESERVED_FLAG_NAMES) and validateDeclaredFields
      # hard-errors on the collision. Same enum, same semantics.
      # "map" (ticket 45) is a real sentinel, not a child-ticket type: a map
      # entry sets kind: map and carries no "map" field of its own, replacing
      # the old status: resolved workaround ticket 40 flagged as unfixed.
      kind:
        type: enum
        values: [research, prototype, grilling, task, map]
      blockedBy:
        type: string
      # Ticket 45: a child ticket's parent map, by that map's own entry id.
      # Not required — a map entry has none — so this stays a convention
      # (documented in docs/agents/issue-tracker.md) rather than a schema
      # constraint the write path enforces.
      map:
        type: string

  tickets-past:
    description: >-
      Wayfinder maps that have closed, and every resolved ticket under
      them — issue tracker (ADR 0018), past tier (Ticket 9, neuron-2.4.3).
    storage: vector
    fields: *ticketsFields

  tickets-future:
    description: >-
      Wayfinder maps chartered/parked but explicitly "not yet sequenced",
      and their children — issue tracker (ADR 0018), future tier
      (Ticket 9, neuron-2.4.3).
    storage: vector
    fields: *ticketsFields

  git-notes:
    description: >-
      Commentary attached to an already-existing commit (why an approach was
      later reversed, a regression traced back to it, context that didn't
      belong in the commit message) — distinct from the auto-populated,
      read-only git_log_index. Ticket 5 (neuron-2.4.2), graduated from
      ticket 2's provenance-enforcement design.
    fields:
      commitRef:
        type: commitRef
        required: true

scan:
  enabled: true
  depth: 3

pullRules:
  default:
    categories:
      - learning
      - decisions
    limit: 5
    minScore: 0.35

  onExec:
    - commandPattern: ".*"
      categories:
        - learning
      limit: 8

    - commandPattern: "^(npm test|git commit)"
      categories:
        - learning
        - decisions
      limit: 5
