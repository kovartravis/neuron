version: "1.0"

storage:
  mode: md
  path: .neuron

categories:
  learning:
    description: Agent conventions, rules, and failure fixes
    tags:
      - rule
      - convention
      - failure-fix

  history:
    description: Action history log and completed task summary
    tags:
      - task
      - history

  decisions:
    description: Architectural Decision Records (ADRs) & design choices
    tags:
      - adr
      - architecture
      - design
  architecture: {}

  tickets:
    description: Wayfinder maps and tickets (issue tracker) — ADR 0018
    fields:
      status:
        type: enum
        values: [unclaimed, claimed, resolved]
        default: unclaimed
      # ADR 0018 names this field "type"; renamed to "kind" here because
      # "type" is already a reserved built-in CLI flag (--type,
      # neuronYaml.ts's RESERVED_FLAG_NAMES) and validateDeclaredFields
      # hard-errors on the collision. Same enum, same semantics.
      # "map" (ticket 45) is a real sentinel, not a child-ticket type: a map
      # entry sets kind: map and carries no "map" field of its own, replacing
      # the old status: resolved workaround ticket 40 flagged as unfixed.
      kind:
        type: enum
        values: [research, prototype, grilling, task, map]
      blockedBy:
        type: string
      # Ticket 45: a child ticket's parent map, by that map's own entry id.
      # Not required — a map entry has none — so this stays a convention
      # (documented in docs/agents/issue-tracker.md) rather than a schema
      # constraint the write path enforces.
      map:
        type: string

scan:
  enabled: true
  depth: 3

pullRules:
  default:
    categories:
      - learning
      - decisions
    limit: 5
    minScore: 0.35

  onExec:
    - commandPattern: ".*"
      categories:
        - learning
      limit: 8

    - commandPattern: "^(npm test|git commit)"
      categories:
        - learning
        - history
        - decisions
      limit: 5
